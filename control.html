
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSC Scoreboard Control</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#1f1f1f;
    color:white;
    padding:30px;
}

input{
    width:250px;
    padding:10px;
    margin:5px;
    font-size:18px;
}

button{
    padding:12px 18px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<h1>CSC Qatar Scoreboard Control</h1>

<h2>Teams</h2>

<input id="home" placeholder="Home Team">
<input id="away" placeholder="Away Team">

<button onclick="saveTeams()">Update Teams</button>

<h2>Score</h2>

<button onclick="homePlus()">Home +</button>
<button onclick="homeMinus()">Home -</button>

<button onclick="awayPlus()">Away +</button>
<button onclick="awayMinus()">Away -</button>

<script>

let homeScore=0;
let awayScore=0;

function saveTeams(){

localStorage.setItem("homeTeam",home.value);
localStorage.setItem("awayTeam",away.value);

}

function homePlus(){
homeScore++;
localStorage.setItem("homeScore",homeScore);
}

function homeMinus(){
if(homeScore>0){
homeScore--;
localStorage.setItem("homeScore",homeScore);
}
}

function awayPlus(){
awayScore++;
localStorage.setItem("awayScore",awayScore);
}

function awayMinus(){
if(awayScore>0){
awayScore--;
localStorage.setItem("awayScore",awayScore);
}
}

</script>

</body>
</html>
