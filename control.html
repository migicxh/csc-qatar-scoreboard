
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Broadcast Control</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#181818;
    color:white;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.section{
    background:#262626;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

input{
    width:250px;
    padding:10px;
    font-size:18px;
    margin:5px;
}

button{
    padding:10px 18px;
    font-size:18px;
    margin:5px;
    cursor:pointer;
}

.score{
    font-size:26px;
    margin:15px 0;
}
</style>

</head>
<body>

<h1>CSC Broadcast Control Panel</h1>

<div class="section">

<h2>Teams</h2>

<input id="home" placeholder="Home Team">

<input id="away" placeholder="Away Team">

<br>

<button onclick="updateTeams()">Update Teams</button>

</div>

<div class="section">

<h2>Score</h2>

<div class="score">

<button onclick="homeMinus()">-</button>

<button onclick="homePlus()">HOME +</button>

<button onclick="awayPlus()">AWAY +</button>

<button onclick="awayMinus()">-</button>

</div>

</div>

<div class="section">

<h2>Match Status</h2>

<button onclick="setStatus('1ST HALF')">1ST HALF</button>

<button onclick="setStatus('HALFTIME')">HALFTIME</button>

<button onclick="setStatus('2ND HALF')">2ND HALF</button>

<button onclick="setStatus('FULL TIME')">FULL TIME</button>

</div>

<script src="control.js"></script>

</body>
</html>
