
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Qatar Scoreboard</title>

<style>
body{
    margin:0;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.scoreboard{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    background:#7A003C;
    color:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.team{
    padding:14px 28px;
    font-weight:bold;
    font-size:20px;
}

.score{
    background:white;
    color:#111;
    padding:14px 26px;
    font-size:26px;
    font-weight:bold;
}

.time{
    background:#55002A;
    padding:14px 22px;
    font-size:18px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="scoreboard">

<div class="team">HOME</div>

<div class="score">
0 - 0
</div>

<div class="team">AWAY</div>

<div class="time">
00:00
</div>

</div>

</body>
</html>
