
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSC Scoreboard Control</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

input,button,select{
    padding:10px;
    margin:5px;
    font-size:16px;
}

.section{
    margin-bottom:20px;
    border:1px solid #444;
    padding:15px;
    border-radius:10px;
}

button{
    cursor:pointer;
}
</style>

</head>

<body>

<h1>CSC Scoreboard Control</h1>

<div class="section">

<h2>Teams</h2>

<input id="home" placeholder="Home Team">

<input id="away" placeholder="Away Team">

<br>

<button onclick="updateTeams()">Update Teams</button>

</div>

<div class="section">

<h2>Score</h2>

<input id="homeScoreInput" type="number" value="0" readonly>

<button onclick="homeMinus()">-</button>

<button onclick="homePlus()">+</button>

<br><br>

<input id="awayScoreInput" type="number" value="0" readonly>

<button onclick="awayMinus()">-</button>

<button onclick="awayPlus()">+</button>

</div>

<div class="section">

<h2>Match Status</h2>

<button onclick="setStatus('1ST HALF')">1ST HALF</button>

<button onclick="setStatus('HALFTIME')">HALFTIME</button>

<button onclick="setStatus('2ND HALF')">2ND HALF</button>

<button onclick="setStatus('FULLTIME')">FULLTIME</button>

</div>

<script type="module" src="control.js"></script>

</body>

</html>
