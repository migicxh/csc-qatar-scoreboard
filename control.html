
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Scoreboard Control</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#202124;
    color:white;
    padding:30px;
}

h1{
    color:#fff;
}

input{
    width:250px;
    padding:10px;
    margin:8px 0;
    font-size:18px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<h1>CSC Qatar Scoreboard Control</h1>

<p>Home Team</p>
<input id="home" placeholder="Home Team">

<p>Away Team</p>
<input id="away" placeholder="Away Team">

<br><br>

<button onclick="saveTeams()">Update Teams</button>

<script>
function saveTeams(){

localStorage.setItem("homeTeam",
document.getElementById("home").value);

localStorage.setItem("awayTeam",
document.getElementById("away").value);

alert("Updated!");
}
</script>

</body>
</html>
