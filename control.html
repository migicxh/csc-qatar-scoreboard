
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSC Broadcast Control Panel</title>

<style>
body{
    margin:0;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.panel{
    background:#1f2937;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.panel h2{
    margin-top:0;
}

input{
    width:220px;
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.green{background:#22c55e;color:white;}
.red{background:#ef4444;color:white;}
.yellow{background:#facc15;color:black;}
.blue{background:#3b82f6;color:white;}
.gray{background:#6b7280;color:white;}
</style>

</head>

<body>

<h1>⚽ CSC Broadcast Control Panel</h1>

<div class="panel">

<h2>Teams</h2>

<input id="home" placeholder="Home Team">

<input id="away" placeholder="Away Team">

<br>

<button class="blue" onclick="updateTeams()">Update Teams</button>

</div>

<div class="panel">

<h2>Score</h2>

<button class="green" onclick="homePlus()">Home +</button>
<button class="red" onclick="homeMinus()">Home -</button>

<button class="green" onclick="awayPlus()">Away +</button>
<button class="red" onclick="awayMinus()">Away -</button>

</div>

<div class="panel">

<h2>Clock</h2>

<button class="green" onclick="startClock()">▶ Start</button>

<button class="yellow" onclick="pauseClock()">⏸ Pause</button>

<button class="red" onclick="resetClock()">⟲ Reset</button>

</div>

<div class="panel">

<h2>Added Time</h2>

<button class="green" onclick="addAddedTime()">+1 Minute</button>

<button class="red" onclick="removeAddedTime()">-1 Minute</button>

</div>

<div class="panel">

<h2>Cards</h2>

<button class="yellow" onclick="homeYellow()">🟨 Home</button>

<button class="yellow" onclick="awayYellow()">🟨 Away</button>

<br>

<button class="red" onclick="homeRed()">🟥 Home</button>

<button class="red" onclick="awayRed()">🟥 Away</button>

</div>

<div class="panel">

<h2>Match Status</h2>

<button class="gray" onclick="setStatus('1ST HALF')">1ST HALF</button>

<button class="gray" onclick="setStatus('HALFTIME')">HALFTIME</button>

<button class="gray" onclick="setStatus('2ND HALF')">2ND HALF</button>

<button class="gray" onclick="setStatus('FULL TIME')">FULL TIME</button>

<button class="gray" onclick="setStatus('EXTRA TIME')">EXTRA TIME</button>

<button class="gray" onclick="setStatus('PENALTIES')">PENALTIES</button>

</div>

<script src="control.js"></script>

</body>
</html>
