
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSC Broadcast Control</title>

<style>
body{
    margin:0;
    background:#151515;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:30px;
}

.panel{
    background:#232323;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1,h2{
    margin-top:0;
}

input{
    width:250px;
    padding:10px;
    font-size:18px;
    margin:5px;
}

button{
    padding:10px 18px;
    font-size:17px;
    margin:5px;
    cursor:pointer;
}

.green{
    background:#28a745;
    color:white;
}

.orange{
    background:#ffc107;
    color:black;
}

.red{
    background:#dc3545;
    color:white;
}

.blue{
    background:#007bff;
    color:white;
}
</style>

</head>

<body>

<h1>CSC Broadcast Control Panel</h1>

<div class="panel">

<h2>Teams</h2>

<input id="home" placeholder="Home Team">

<input id="away" placeholder="Away Team">

<br>

<button onclick="updateTeams()">Update Teams</button>

</div>

<div class="panel">

<h2>Score</h2>

<button onclick="homeMinus()">HOME -</button>

<button onclick="homePlus()">HOME +</button>

<button onclick="awayMinus()">AWAY -</button>

<button onclick="awayPlus()">AWAY +</button>

</div>

<div class="panel">

<h2>Clock</h2>

<button class="green" onclick="startClock()">▶ Start</button>

<button class="orange" onclick="pauseClock()">⏸ Pause</button>

<button class="red" onclick="resetClock()">⟲ Reset</button>

</div>

<div class="panel">

<h2>Match Status</h2>

<button onclick="setStatus('1ST HALF')">1ST HALF</button>

<button onclick="setStatus('HALFTIME')">HALFTIME</button>

<button onclick="setStatus('2ND HALF')">2ND HALF</button>

<button onclick="setStatus('FULL TIME')">FULL TIME</button>

<button onclick="setStatus('EXTRA TIME')">EXTRA TIME</button>

<button onclick="setStatus('PENALTIES')">PENALTIES</button>

</div>

<div class="panel">

<h2>Cards</h2>

<button class="orange" onclick="homeYellow()">🟨 Home</button>

<button class="orange" onclick="awayYellow()">🟨 Away</button>

<br>

<button class="red" onclick="homeRed()">🟥 Home</button>

<button class="red" onclick="awayRed()">🟥 Away</button>

</div>

<script src="control.js"></script>

</body>
</html>
