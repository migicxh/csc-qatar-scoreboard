
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSC Broadcast Overlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="scoreboard">

    <div class="team">

        <img id="homeLogo" src="assets/default-team.png">

        <div>

            <div class="team-name" id="homeTeam">HOME</div>

            <div class="cards">

                <span id="homeYellowCount">🟨0</span>

                <span id="homeRedCount">🟥0</span>

            </div>

        </div>

    </div>

    <div class="score">

        <span id="homeScore">0</span>

        <span>-</span>

        <span id="awayScore">0</span>

    </div>

    <div class="team">

        <div>

            <div class="team-name" id="awayTeam">AWAY</div>

            <div class="cards">

                <span id="awayYellowCount">🟨0</span>

                <span id="awayRedCount">🟥0</span>

            </div>

        </div>

        <img id="awayLogo" src="assets/default-team.png">

    </div>

    <div class="time-box">

        <div class="time" id="timer">00:00</div>

        <div class="status" id="matchStatus">
            1ST HALF
        </div>

        <div id="addedTime">
            +0
        </div>

    </div>

</div>

<script src="overlay.js"></script>

</body>
</html>
